<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Холопы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f0e6;
      color: #3d2b1f;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f0e6;
    }

    .balance {
      font-size: 22px;
      font-weight: 700;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 8px 20px;
      border-radius: 20px;
      background: #e8dfd0;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #5c4a3a;
    }

    .tab.active {
      background: #8b3a3a;
      color: white;
    }

    .tap-area {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #fff8ee;
      border: 4px solid #c4a77d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      user-select: none;
    }

    .tap-area:active {
      transform: scale(0.92);
    }

    .coin {
      font-size: 80px;
    }

    .tap-reward {
      position: absolute;
      font-size: 22px;
      font-weight: 700;
      color: #8b3a3a;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-80px); }
    }

    .energy-bar {
      width: 80%;
      max-width: 280px;
      margin-top: 30px;
    }

    .energy-text {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
      color: #5c4a3a;
    }

    .energy-track {
      height: 12px;
      background: #e0d5c5;
      border-radius: 10px;
      overflow: hidden;
    }

    .energy-fill {
      height: 100%;
      background: #8b3a3a;
      border-radius: 10px;
      transition: width 0.2s;
    }

    .bottom-nav {
      display: flex;
      background: #fff8ee;
      border-top: 1px solid #e0d5c5;
      padding: 8px 0 20px;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #8a7a6a;
      background: none;
      border: none;
    }

    .nav-item.active {
      color: #8b3a3a;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 22px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="balance" id="balance">0</div>
    <div style="font-size:18px">🏆</div>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="tab active">Тапать</button>
      <button class="tab">Прокачка</button>
    </div>

    <div class="tap-area" id="tapArea">
      <div class="coin">🪙</div>
    </div>

    <div class="energy-bar">
      <div class="energy-text">
        <span>Энергия</span>
        <span id="energyText">100 / 100</span>
      </div>
      <div class="energy-track">
        <div class="energy-fill" id="energyFill" style="width: 100%"></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item">
      <div class="nav-icon">👥</div>
      <div>Рабы</div>
    </button>
    <button class="nav-item active">
      <div class="nav-icon">👆</div>
      <div>Тапать</div>
    </button>
    <button class="nav-item">
      <div class="nav-icon">📋</div>
      <div>Задания</div>
    </button>
    <button class="nav-item">
      <div class="nav-icon">👤</div>
      <div>Профиль</div>
    </button>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Данные игрока (пока локально)
    let coins = 0;
    let energy = 100;
    let maxEnergy = 100;
    let tapPower = 1;
    let energyRegen = 1; // в секунду

    const balanceEl = document.getElementById('balance');
    const energyText = document.getElementById('energyText');
    const energyFill = document.getElementById('energyFill');
    const tapArea = document.getElementById('tapArea');

    function updateUI() {
      balanceEl.textContent = formatNumber(coins);
      energyText.textContent = `${Math.floor(energy)} / ${maxEnergy}`;
      energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
    }

    function formatNumber(num) {
      if (num >= 1_000_000) return (num / 1_000_000).toFixed(1) + 'M';
      if (num >= 1_000) return (num / 1_000).toFixed(1) + 'K';
      return Math.floor(num).toString();
    }

    // Тап
    tapArea.addEventListener('click', (e) => {
      if (energy < 1) return;

      energy -= 1;
      coins += tapPower;
      updateUI();

      // Анимация +число
      const reward = document.createElement('div');
      reward.className = 'tap-reward';
      reward.textContent = `+${tapPower}`;
      reward.style.left = `${e.clientX - 20}px`;
      reward.style.top = `${e.clientY - 40}px`;
      document.body.appendChild(reward);
      setTimeout(() => reward.remove(), 700);
    });

    // Регенерация энергии
    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + energyRegen / 10);
        updateUI();
      }
    }, 100);

    updateUI();
  </script>
</body>
  </html>
